name: tests

# Runs the checks on every push and pull request. It only tests; it never trades or touches a database.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Windows, because the project runs on Windows (file locks, batch files, paths).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Secret scan
        run: python -m src.ops.secret_scan
      - name: Lint (real-bug rules)
        run: python -m ruff check
      - name: Dependency audit
        run: python -m pip_audit --progress-spinner off
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider

  secrets:
    # gitleaks scans the whole git history for committed secrets, using .gitleaks.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install the browser for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
