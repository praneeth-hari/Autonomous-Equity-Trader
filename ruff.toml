# Lint settings. The gate blocks only on rules that find real bugs; cosmetic rules (unused imports, f-string style)
# are deliberately not enforced so the frozen V1 code is not mass-edited for no benefit.
target-version = "py311"

# fix_test*.py are untracked scratch files in the project root, not part of the project.
extend-exclude = ["scratch", "web", "fix_test*.py", "data", "logs", "reports", ".venv"]

[lint]
select = [
    "E9",   # syntax errors
    "F63",  # invalid comparisons and assertions (e.g. `assert (x, "msg")`)
    "F7",   # misplaced return/yield/break and similar
    "F82",  # undefined names
    "F811", # a name redefined before use (e.g. a local import shadowing a module-level one)
    "F841", # a value computed and never used: often dead or half-finished logic
    "B007", # a loop variable that is never used
]

[lint.per-file-ignores]
# In tests an unused result or a re-import is usually deliberate (calling for the side effect), so these
# rules guard application code only.
"tests/**" = ["F811", "F841", "B007"]
